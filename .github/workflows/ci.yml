name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  visual-auth:
    name: Hosted staging visual auth smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    environment: agent-ui
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global agent-browser@0.26.0
      - run: agent-browser install --with-deps
      - name: Build the app against isolated staging Supabase
        run: npm run build
      - name: Start the app
        run: npm run start > /tmp/calorie-flow.log 2>&1 &
      - name: Wait for the app
        run: npx wait-on@8.0.1 http://127.0.0.1:3000
      - name: Sign in and capture narrow and desktop evidence
        run: npm run test:visual
      - name: Upload visual-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-auth-evidence
          path: artifacts/e2e/
          if-no-files-found: ignore
